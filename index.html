<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <title>왁부 슬라임</title>
    <style>
      /* Splash — inline so it paints on the very first frame the WebView
         renders, before any React / CSS module bundle is parsed. Always
         black regardless of theme (user request). Removed by main.tsx
         after React mounts, with a minimum on-screen time of 850 ms so
         users always see the logo instead of a subliminal flash on fast
         cold starts. */
      #splash {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 2147483647;
        opacity: 1;
        transition: opacity 260ms ease;
      }
      #splash.fade { opacity: 0; }
      #splash img {
        width: 17vmin;
        height: 17vmin;
        max-width: 105px;
        max-height: 105px;
        object-fit: contain;
      }
      #splash .splashWordmark {
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.04em;
      }
    </style>
    <script>
      // Timestamp for the "minimum 700 ms visible" calculation in main.tsx.
      window.__splashStart = Date.now()
    </script>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.png" alt="" />
      <span class="splashWordmark">soundslime</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
